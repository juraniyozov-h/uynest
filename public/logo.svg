<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="g1" x1="100" y1="10" x2="100" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a6b2f"/>
      <stop offset="100%" stop-color="#3aaa5c"/>
    </linearGradient>
    <linearGradient id="g2" x1="60" y1="110" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a6b2f"/>
      <stop offset="100%" stop-color="#4dc96e"/>
    </linearGradient>
  </defs>

  <!-- Roof -->
  <polyline points="100,14 162,62 38,62" stroke="url(#g1)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- Left column -->
  <line x1="60" y1="62" x2="60" y2="108" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
  <!-- Right column -->
  <line x1="140" y1="62" x2="140" y2="108" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>

  <!-- Window frame -->
  <rect x="83" y="64" width="34" height="30" rx="2" stroke="url(#g1)" stroke-width="5" fill="none"/>
  <!-- Window cross -->
  <line x1="100" y1="64" x2="100" y2="94" stroke="url(#g1)" stroke-width="3"/>
  <line x1="83" y1="79" x2="117" y2="79" stroke="url(#g1)" stroke-width="3"/>

  <!-- Nest swoosh 1 (largest) -->
  <path d="M34,115 Q100,88 166,115" stroke="url(#g2)" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Nest swoosh 2 -->
  <path d="M44,126 Q100,102 156,126" stroke="url(#g2)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Nest swoosh 3 (smallest) -->
  <path d="M58,136 Q100,118 142,136" stroke="url(#g2)" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
